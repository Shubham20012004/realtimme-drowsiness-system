<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver monitoring lab</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui;margin:0;color:#e4ede9;background:#10201e}main{max-width:1120px;margin:auto;padding:4vw}h1{font-size:clamp(32px,6vw,64px);letter-spacing:-.06em;margin:.2em 0}h2{font-size:18px}header,section{border-bottom:1px solid #47615b;padding:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}article{background:#1d332f;padding:15px;border-radius:6px}strong{display:block;font-size:24px;color:#9de4bf}label{display:block}input,select,button,a{font:inherit;color:inherit}input,select,button{padding:8px;background:#233f38;border:1px solid #56796b;border-radius:4px;max-width:100%}button{cursor:pointer}a{color:#a9e7c6}svg{width:100%;height:150px;background:#162b27}form{display:flex;align-items:end;gap:10px;flex-wrap:wrap}input{width:140px}p{color:#b9c9c3}
</style><main><header><h1>Driver monitoring lab</h1><label>Research session <select id="sessions"></select></label><p id="status" role="status">Loading sessions…</p></header>
<section><div class="grid" id="metrics"></div></section><section><h2>Normalized eye opening</h2><svg id="chart" viewBox="0 0 900 150" preserveAspectRatio="none" aria-label="Normalized eye opening by session time"></svg><p id="range"></p><a id="download" hidden>Export session CSV</a></section>
<section><h2>Independent observation</h2><form id="form"><label>Start (s)<br><input name="start" type="number" min="0" step="any" required></label><label>End (s)<br><input name="end" type="number" min="0" step="any" required></label><label>Observed behaviour<br><input name="label" maxlength="64" required></label><label>Observer code<br><input name="observer" maxlength="64" required></label><button>Save interval</button></form><p id="notice" role="status"></p><ul id="history"></ul></section></main>
<script>
const el=id=>document.getElementById(id);
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('Request failed '+r.status);return r.json()}
const fields={status:'Tracking / operation',state:'Rule estimate',prediction:'Model estimate',perclos:'Closure fraction',closure_s:'Closure (s)',blink_per_min:'Blinks / min',pitch:'Pitch (°)',actual_fps:'Processed FPS',serial_status:'Arduino',dropped_records:'Dropped records'};
function render(row){el('metrics').replaceChildren(...Object.entries(fields).map(([k,label])=>{const box=document.createElement('article'),v=document.createElement('strong');v.textContent=typeof row[k]==='number'?Number(row[k].toFixed(2)):row[k]??'Unavailable';box.append(label,v);return box}))}
async function refresh(){const sessions=await get('/sessions');const prev=el('sessions').value;el('sessions').replaceChildren(...sessions.map(s=>new Option(s.started+' · '+s.participant+' · '+s.id.slice(0,6),s.id)));if(sessions.some(s=>s.id===prev))el('sessions').value=prev;const id=el('sessions').value;el('form').querySelector('button').disabled=!id;if(!id){el('status').textContent='No recorded sessions. Start the camera or a video run.';render({});return}
const base='/sessions/'+encodeURIComponent(id);const [row,data,notes]=await Promise.all([get(base+'/latest'),get(base+'/frames'),get(base+'/annotations')]);el('status').textContent=sessions.find(s=>s.id===id).conditions;render(row);el('download').hidden=false;el('download').href=base+'/export.csv';const chart=el('chart');chart.replaceChildren();const a=data[0]?.t,b=data.at(-1)?.t;let d='',pen=false;for(const v of data){if(v.normalized==null){pen=false;continue}d+=(pen?' L':' M')+(900*(v.t-a)/(b-a||1))+' '+(150-75*Math.min(2,v.normalized));pen=true}const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);path.setAttribute('stroke','#9de4bf');path.setAttribute('stroke-width','2');path.setAttribute('fill','none');chart.append(path);el('range').textContent=d?('Session '+a.toFixed(1)+'–'+b.toFixed(1)+' s · vertical scale 0–2'):'Waiting for calibrated observations';el('history').replaceChildren(...notes.map(n=>{const li=document.createElement('li');li.textContent=n.start+'–'+n.end+' s · '+n.label+' · '+n.observer;return li}))}
el('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.session=el('sessions').value;data.start=Number(data.start);data.end=Number(data.end);try{const r=await fetch('/annotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();el('notice').textContent=r.ok?'Saved observation '+j.id:JSON.stringify(j.detail)}catch(err){el('notice').textContent=err.message}};
async function poll(){try{await refresh()}catch(e){el('status').textContent=e.message;render({status:'OFFLINE'})}setTimeout(poll,1500)}poll()
</script></html>
